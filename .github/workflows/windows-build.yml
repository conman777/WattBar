name: Windows build

on:
  push:
    paths:
      - "Sources/WattBar.Windows/**"
      - "BuildWattBar.Windows.ps1"
      - "WattBar.Windows.cmd"
      - "Tools/Set-ExternalPowerSample.ps1"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "Sources/WattBar.Windows/**"
      - "BuildWattBar.Windows.ps1"
      - "WattBar.Windows.cmd"
      - "Tools/Set-ExternalPowerSample.ps1"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run self-tests
        shell: powershell
        run: .\BuildWattBar.Windows.ps1 -Test
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: WattBar-Windows
          path: WattBar.Windows.exe
